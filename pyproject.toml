[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-extractor-noora"
version = "0.1.0"
description = "Automated clinical data extraction from scientific PDFs for systematic reviews"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Noora"},
]
dependencies = [
    "python-dotenv>=1.0.0",
    "docling>=2.0.0",
    "docling-core>=2.0.0",
    "ollama>=0.4.0",
    "anthropic>=0.49.0",
    "google-genai>=0.3.0",
    "Pillow>=10.0.0",
    "pytesseract>=0.3.10",
]

[project.scripts]
data-extractor = "main:main"
